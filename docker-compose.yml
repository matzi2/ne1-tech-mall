services:
  mall:
    build: .
    image: ne1-tech-mall:0.2.3
    container_name: ne1-tech-mall
    restart: unless-stopped
    ports:
      - "43177:43177"
    environment:
      NODE_ENV: production
      PORT: "43177"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43177/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 40s
